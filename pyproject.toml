[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-profiler"
version = "0.1.0"
description = "Sparsity-aware inference characterisation for Mixture-of-Experts models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "matplotlib",
    "numpy",
    "pandas",
    "pydantic>=2",
    "pyyaml",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "ruff",
]

[project.scripts]
moe-profiler = "moe_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
